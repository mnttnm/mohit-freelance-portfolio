<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gilt Thread</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #FAFAFA; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(function () {
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  if (!ctx) return;
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var DRAW_SPEED = 0.6;
  var THREAD_COUNT = 4;
  var SHAPE = 1;
  var TRAIL_MAX = 600;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var needsResize = true;
  var W = 0, H = 0;

  function resize() {
    needsResize = false;
    var nw = Math.round(canvas.clientWidth * dpr);
    var nh = Math.round(canvas.clientHeight * dpr);
    if (nw !== W || nh !== H) {
      W = nw; H = nh;
      canvas.width = W; canvas.height = H;
    }
  }

  var PHI = 1.618033988749895;
  function makeThread(idx) {
    var freqs = [
      [3, 2 * PHI], [2, 3 * PHI], [5, 3 * PHI], [3 * PHI, 5],
      [4, 3 * PHI + 1], [2 * PHI, 5], [5, 4 * PHI], [3, 5 * PHI]
    ];
    var f = freqs[idx % freqs.length];
    return {
      fx: f[0], fy: f[1],
      px: idx * 0.93 + 0.5, py: idx * 1.17 + 2.3,
      mfx: 0.11 + idx * 0.037, mfy: 0.13 + idx * 0.029,
      ax: 0.52 + (idx % 3) * 0.06, ay: 0.48 + ((idx + 1) % 3) * 0.06,
      speed: 0.55 + idx * 0.04,
      width: 1.8 + (idx % 3) * 0.4,
      hue: idx * 0.15,
      sparkles: [], trail: []
    };
  }

  var mouseWarp = 0, smoothWarp = 0;

  function pos(th, t) {
    var s = t * th.speed;
    var ax = th.ax * (1 + 0.18 * Math.sin(s * th.mfx));
    var ay = th.ay * (1 + 0.18 * Math.sin(s * th.mfy));
    var w = smoothWarp;
    return {
      x: Math.sin(s * (th.fx + w * 0.5) + th.px) * ax,
      y: Math.sin(s * (th.fy - w * 0.3) + th.py) * ay
    };
  }

  function tangent(th, t) {
    var dt = 0.0005;
    var a = pos(th, t - dt), b = pos(th, t + dt);
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    return { x: dx / len, y: dy / len };
  }

  /* Monochrome silver/gray metallic for minimal white bg */
  var LX = 0.58, LY = -0.82;
  function metallicRGBA(tang, hueShift, alpha) {
    var dot = tang.x * LX + tang.y * LY;
    var spec = dot * dot;
    var cross = Math.abs(-tang.y * LX + tang.x * LY);
    var base = 140 + spec * 50 + cross * 15;
    var r = Math.min(210, Math.max(110, base + hueShift * 2)) | 0;
    var g = Math.min(210, Math.max(110, base - hueShift * 1)) | 0;
    var b = Math.min(215, Math.max(115, base)) | 0;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha.toFixed(3) + ')';
  }

  function addSparkle(th, x, y) {
    if (th.sparkles.length > 20) return;
    th.sparkles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5,
      life: 1, decay: 0.02 + Math.random() * 0.025,
      size: (0.8 + Math.random() * 1.2) * dpr
    });
  }

  function tickAndDrawSparkles(th) {
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    for (var i = th.sparkles.length - 1; i >= 0; i--) {
      var s = th.sparkles[i];
      s.x += s.vx; s.y += s.vy; s.vx *= 0.95; s.vy *= 0.95; s.life -= s.decay;
      if (s.life <= 0) { th.sparkles.splice(i, 1); continue; }
      var a = s.life * s.life, r = s.size * s.life;
      ctx.fillStyle = 'rgba(160,160,170,' + (a * 0.15).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 2.5, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(190,190,200,' + (a * 0.5).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  var smoothCX = 0, smoothCY = 0;
  function updateTrail(th, tNow) {
    smoothWarp += (mouseWarp - smoothWarp) * 0.03;
    smoothCX = W * 0.5; smoothCY = H * 0.5;
    var scale = Math.min(W, H) * 0.55;
    var p = pos(th, tNow), tg = tangent(th, tNow);
    th.trail.push({ x: smoothCX + p.x * scale, y: smoothCY + p.y * scale, tx: tg.x, ty: tg.y });
    if (th.trail.length > TRAIL_MAX) th.trail.shift();
  }

  function drawThread(th, threadIdx) {
    var trail = th.trail, len = trail.length;
    if (len < 2) return;
    var w = th.width * dpr;

    /* Outer glow — very subtle on white */
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = w * 4; ctx.strokeStyle = 'rgba(150,150,160,0.02)';
    ctx.beginPath(); ctx.moveTo(trail[0].x, trail[0].y);
    for (var i = 1; i < len; i++) ctx.lineTo(trail[i].x, trail[i].y);
    ctx.stroke(); ctx.restore();

    /* Inner glow */
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = w * 2.2; ctx.strokeStyle = 'rgba(150,150,160,0.04)';
    ctx.beginPath(); ctx.moveTo(trail[0].x, trail[0].y);
    for (var i = 1; i < len; i++) ctx.lineTo(trail[i].x, trail[i].y);
    ctx.stroke(); ctx.restore();

    /* Per-segment metallic body */
    for (var i = 1; i < len; i++) {
      var frac = i / len, alpha = frac * frac;
      if (alpha < 0.003) continue;
      var a = trail[i - 1], b = trail[i];
      var wm = 0.88 + 0.12 * Math.sin(frac * 20 + time * 3 + threadIdx);
      var lw = w * wm;

      /* Shadow */
      var shadowA = 0.15 * alpha;
      if (shadowA > 0.005) {
        ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = lw * 1.2;
        ctx.strokeStyle = 'rgba(120,120,130,' + shadowA.toFixed(3) + ')';
        ctx.beginPath(); ctx.moveTo(a.x + dpr * 0.5, a.y + dpr); ctx.lineTo(b.x + dpr * 0.5, b.y + dpr);
        ctx.stroke(); ctx.restore();
      }

      /* Main body */
      var tang = { x: (a.tx + b.tx) * 0.5, y: (a.ty + b.ty) * 0.5 };
      ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = lw;
      ctx.strokeStyle = metallicRGBA(tang, th.hue, 0.65 * alpha);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.stroke(); ctx.restore();

      /* Specular highlight */
      var dot = tang.x * LX + tang.y * LY;
      var spec = dot * dot * dot * dot;
      if (spec > 0.08 && alpha > 0.05) {
        var nx = -tang.y, ny = tang.x, off = lw * 0.22;
        ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = lw * 0.25;
        ctx.strokeStyle = 'rgba(200,200,210,' + (spec * 0.4 * alpha).toFixed(3) + ')';
        ctx.beginPath(); ctx.moveTo(a.x + nx * off, a.y + ny * off); ctx.lineTo(b.x + nx * off, b.y + ny * off);
        ctx.stroke(); ctx.restore();
      }
    }

    var tip = trail[len - 1];
    if (Math.random() < 0.4) addSparkle(th, tip.x, tip.y);
    tickAndDrawSparkles(th);
  }

  var mouseDown = false;
  canvas.addEventListener('mousedown', function(e) { mouseDown = true; mouseWarp = (e.clientX / canvas.clientWidth - 0.5) * 4; });
  canvas.addEventListener('mousemove', function(e) { if (mouseDown) mouseWarp = (e.clientX / canvas.clientWidth - 0.5) * 4; });
  canvas.addEventListener('mouseup', function() { mouseDown = false; mouseWarp = 0; });
  canvas.addEventListener('mouseleave', function() { mouseDown = false; mouseWarp = 0; });
  canvas.addEventListener('touchstart', function(e) { mouseDown = true; mouseWarp = (e.touches[0].clientX / canvas.clientWidth - 0.5) * 4; }, { passive: false });
  canvas.addEventListener('touchmove', function(e) { e.preventDefault(); if (mouseDown) mouseWarp = (e.touches[0].clientX / canvas.clientWidth - 0.5) * 4; }, { passive: false });
  canvas.addEventListener('touchend', function() { mouseDown = false; mouseWarp = 0; });

  var threads = [], time = 0, running = true, prevTs = 0;

  function initThreads() {
    threads = [];
    var n = Math.max(2, Math.min(8, Math.round(THREAD_COUNT)));
    for (var i = 0; i < n; i++) threads.push(makeThread(i));
  }

  initThreads(); resize();
  smoothCX = W * 0.5; smoothCY = H * 0.5;
  for (var preFrame = 0; preFrame < 400; preFrame++) {
    time += 0.016 * DRAW_SPEED;
    for (var i = 0; i < threads.length; i++) updateTrail(threads[i], time + i * 0.4);
  }

  function frame(ts) {
    if (!running) return;
    if (prevTs === 0) prevTs = ts;
    var dt = Math.min((ts - prevTs) / 1000, 0.05);
    prevTs = ts;
    if (prefersReduced) dt = 0;
    time += dt * DRAW_SPEED;
    if (needsResize) resize();
    for (var i = 0; i < threads.length; i++) updateTrail(threads[i], time + i * 0.4);

    /* White background fill */
    ctx.fillStyle = '#FAFAFA';
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < threads.length; i++) drawThread(threads[i], i);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function() { needsResize = true; });
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', function() {
    running = !document.hidden;
    if (running) { prevTs = 0; requestAnimationFrame(frame); }
  });
})();
</script>
</body>
</html>
