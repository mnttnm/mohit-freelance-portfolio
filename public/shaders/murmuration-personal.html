<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murmuration</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #F5F0E8; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(function () {
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var urlParams = new URLSearchParams(window.location.search);
  var pixelScale = parseFloat(urlParams.get('p')) || 1;

  var FLOCK_SIZE = 0.7;
  var COHESION_PARAM = 1.0;

  var BASE_COUNT = 2500;
  var MAX_SPEED = 240;
  var MIN_SPEED = 80;
  var SEPARATION_RADIUS = 14;
  var NEIGHBOR_RADIUS = 50;
  var SEPARATION_WEIGHT = 350;
  var ALIGNMENT_WEIGHT = 5.0;
  var COHESION_WEIGHT = 0.3;
  var WIND_SCALE = 0.0003;
  var WIND_STRENGTH = 120;
  var CELL_SIZE = 55;
  var TRAIL_ALPHA = 0.09;
  var IMPULSE_INTERVAL_MIN = 5000;
  var IMPULSE_INTERVAL_MAX = 8000;
  var IMPULSE_SPEED = 300;
  var IMPULSE_STRENGTH = 140;
  var IMPULSE_FALLOFF = 0.5;

  var mouseX = 0, mouseY = 0, mouseActive = false, mouseDown = false;
  var W, H, dpr, running = true, time = 0, lastTime = 0, frameCount = 0;
  var px, py, pvx, pvy, psize, pbright, pcount = 0;
  var gridData, gridCount, gridCols, gridRows, gridTotal, GRID_CAPACITY = 40;
  var attractX, attractY;
  var impulses = [], nextImpulseTime = 0;

  var noiseSeed = Math.random() * 65536;
  function hashN(x, y) { var n = Math.sin(x * 127.1 + y * 311.7 + noiseSeed) * 43758.5453; return n - Math.floor(n); }
  function smoothNoise(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    var a = hashN(ix, iy), b = hashN(ix + 1, iy), c = hashN(ix, iy + 1), d = hashN(ix + 1, iy + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }
  function fbmNoise(x, y) { return smoothNoise(x, y) * 0.65 + smoothNoise(x * 2.1, y * 2.1) * 0.25 + smoothNoise(x * 4.3, y * 4.3) * 0.1; }

  function scheduleImpulse() { nextImpulseTime = time + IMPULSE_INTERVAL_MIN + Math.random() * (IMPULSE_INTERVAL_MAX - IMPULSE_INTERVAL_MIN); }
  function spawnImpulse() {
    var edge = Math.random() * 4 | 0, ox, oy, dx, dy;
    if (edge === 0) { ox = -50; oy = Math.random() * H; dx = 1; dy = (Math.random() - 0.5) * 0.5; }
    else if (edge === 1) { ox = W + 50; oy = Math.random() * H; dx = -1; dy = (Math.random() - 0.5) * 0.5; }
    else if (edge === 2) { ox = Math.random() * W; oy = -50; dx = (Math.random() - 0.5) * 0.5; dy = 1; }
    else { ox = Math.random() * W; oy = H + 50; dx = (Math.random() - 0.5) * 0.5; dy = -1; }
    var len = Math.sqrt(dx * dx + dy * dy); dx /= len; dy /= len;
    impulses.push({ ox: ox, oy: oy, dx: dx, dy: dy, born: time, front: 0 });
    scheduleImpulse();
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5) * pixelScale;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gridCols = Math.ceil(W / CELL_SIZE) + 2; gridRows = Math.ceil(H / CELL_SIZE) + 2;
    gridTotal = gridCols * gridRows;
    gridCount = new Int32Array(gridTotal); gridData = new Int32Array(gridTotal * GRID_CAPACITY);
  }

  function initParticles() {
    pcount = Math.round(BASE_COUNT * FLOCK_SIZE);
    pcount = Math.max(600, Math.min(pcount, 5000));
    px = new Float32Array(pcount); py = new Float32Array(pcount);
    pvx = new Float32Array(pcount); pvy = new Float32Array(pcount);
    psize = new Float32Array(pcount); pbright = new Float32Array(pcount);
    var nc = 2 + (Math.random() * 2 | 0), cxArr = [], cyArr = [];
    var baseCX = W * 0.35 + Math.random() * W * 0.3, baseCY = H * 0.35 + Math.random() * H * 0.3;
    for (var c = 0; c < nc; c++) { cxArr.push(baseCX + (Math.random() - 0.5) * 200); cyArr.push(baseCY + (Math.random() - 0.5) * 150); }
    for (var i = 0; i < pcount; i++) {
      var ci = i % nc, ang = Math.random() * 6.2832, spread = 20 + Math.random() * 100;
      px[i] = cxArr[ci] + Math.cos(ang) * spread; py[i] = cyArr[ci] + Math.sin(ang) * spread;
      var dir = Math.random() * 6.2832, spd = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED) * 0.35;
      pvx[i] = Math.cos(dir) * spd; pvy[i] = Math.sin(dir) * spd;
      psize[i] = 1.0 + Math.random() * 0.7; pbright[i] = 0.45 + Math.random() * 0.55;
    }
  }

  function buildGrid() {
    for (var i = 0; i < gridTotal; i++) gridCount[i] = 0;
    for (var i = 0; i < pcount; i++) {
      var col = ((px[i] / CELL_SIZE) | 0) + 1, row = ((py[i] / CELL_SIZE) | 0) + 1;
      if (col < 0) col = 0; if (col >= gridCols) col = gridCols - 1;
      if (row < 0) row = 0; if (row >= gridRows) row = gridRows - 1;
      var cell = row * gridCols + col, cnt = gridCount[cell];
      if (cnt < GRID_CAPACITY) { gridData[cell * GRID_CAPACITY + cnt] = i; gridCount[cell] = cnt + 1; }
    }
  }

  function updateParticles(dt) {
    var cohW = COHESION_WEIGHT * COHESION_PARAM;
    var nR2 = NEIGHBOR_RADIUS * NEIGHBOR_RADIUS, sR2 = SEPARATION_RADIUS * SEPARATION_RADIUS;
    var windT = time * 0.00007;
    buildGrid();
    var flockCX = 0, flockCY = 0;
    for (var i = 0; i < pcount; i++) { flockCX += px[i]; flockCY += py[i]; }
    flockCX /= pcount; flockCY /= pcount;
    var at = time * 0.00015;
    attractX = W * 0.1 + smoothNoise(at, 3.7) * W * 0.8;
    attractY = H * 0.1 + smoothNoise(7.1, at) * H * 0.8;
    var diag = Math.sqrt(W * W + H * H) * 1.3;
    for (var imp = impulses.length - 1; imp >= 0; imp--) { impulses[imp].front += IMPULSE_SPEED * dt; if (impulses[imp].front > diag) impulses.splice(imp, 1); }
    var maxDim = Math.max(W, H);

    for (var i = 0; i < pcount; i++) {
      var x = px[i], y = py[i], vx = pvx[i], vy = pvy[i];
      var col = ((x / CELL_SIZE) | 0) + 1, row = ((y / CELL_SIZE) | 0) + 1;
      if (col < 1) col = 1; if (col >= gridCols - 1) col = gridCols - 2;
      if (row < 1) row = 1; if (row >= gridRows - 1) row = gridRows - 2;
      var sepX = 0, sepY = 0, sepN = 0, aliX = 0, aliY = 0, aliN = 0, cohX = 0, cohY = 0, cohN = 0;
      for (var dc = -1; dc <= 1; dc++) for (var dr = -1; dr <= 1; dr++) {
        var cell = (row + dr) * gridCols + (col + dc), cnt = gridCount[cell], base = cell * GRID_CAPACITY;
        for (var k = 0; k < cnt; k++) {
          var j = gridData[base + k]; if (j === i) continue;
          var ddx = px[j] - x, ddy = py[j] - y, d2 = ddx * ddx + ddy * ddy;
          if (d2 < sR2 && d2 > 0.1) { var invD2 = 1.0 / d2; sepX -= ddx * invD2; sepY -= ddy * invD2; sepN++; }
          if (d2 < nR2) { aliX += pvx[j]; aliY += pvy[j]; aliN++; cohX += px[j]; cohY += py[j]; cohN++; }
        }
      }
      var ax = 0, ay = 0;
      if (sepN > 0) { ax += sepX * SEPARATION_WEIGHT; ay += sepY * SEPARATION_WEIGHT; }
      if (aliN > 0) { var invA = 1.0 / aliN; ax += (aliX * invA - vx) * ALIGNMENT_WEIGHT; ay += (aliY * invA - vy) * ALIGNMENT_WEIGHT; }
      if (cohN > 0) { var invC = 1.0 / cohN; ax += (cohX * invC - x) * cohW * 0.5; ay += (cohY * invC - y) * cohW * 0.5; }
      var toFCX = flockCX - x, toFCY = flockCY - y, fcDist = Math.sqrt(toFCX * toFCX + toFCY * toFCY);
      if (fcDist > 120) { var normDist = (fcDist - 120) / maxDim; var fcStr = normDist * 40 * cohW; ax += toFCX / fcDist * fcStr; ay += toFCY / fcDist * fcStr; }
      var toAX = attractX - x, toAY = attractY - y, aDist = Math.sqrt(toAX * toAX + toAY * toAY);
      if (aDist > 10) { var aStr = 20 + Math.min(aDist * 0.05, 30); ax += toAX / aDist * aStr; ay += toAY / aDist * aStr; }
      if (mouseActive) {
        var toMX = mouseX - x, toMY = mouseY - y, mDist = Math.sqrt(toMX * toMX + toMY * toMY);
        if (mDist > 5 && mDist < 350) { var mStr = mouseDown ? 600 : -400; var falloff = 1 - mDist / 350; falloff *= falloff; ax += toMX / mDist * mStr * falloff; ay += toMY / mDist * mStr * falloff; }
      }
      var globalAngle = smoothNoise(windT * 15, 0) * 6.2832;
      var localVar = fbmNoise(x * WIND_SCALE, y * WIND_SCALE + windT * 3) * 1.5 - 0.75;
      ax += Math.cos(globalAngle + localVar) * WIND_STRENGTH; ay += Math.sin(globalAngle + localVar) * WIND_STRENGTH;
      for (var imp = 0; imp < impulses.length; imp++) {
        var w = impulses[imp], rx = x - w.ox, ry = y - w.oy, proj = rx * w.dx + ry * w.dy, dist = Math.abs(proj - w.front);
        if (dist < 150 && proj > -20) { var inf = 1 - dist / 150; inf *= inf; var decay = Math.exp(-((time - w.born) * 0.001) * IMPULSE_FALLOFF); ax += w.dx * IMPULSE_STRENGTH * inf * decay; ay += w.dy * IMPULSE_STRENGTH * inf * decay; }
      }
      var margin = 100;
      if (x < margin) ax += (margin - x) * 1.5; else if (x > W - margin) ax -= (x - W + margin) * 1.5;
      if (y < margin) ay += (margin - y) * 1.5; else if (y > H - margin) ay -= (y - H + margin) * 1.5;
      vx += ax * dt; vy += ay * dt;
      var spd = Math.sqrt(vx * vx + vy * vy);
      if (spd > MAX_SPEED) { var inv = MAX_SPEED / spd; vx *= inv; vy *= inv; }
      else if (spd < MIN_SPEED && spd > 0.1) { var inv = MIN_SPEED / spd; vx *= inv; vy *= inv; }
      x += vx * dt; y += vy * dt;
      if (x < -80) x += W + 160; else if (x > W + 80) x -= W + 160;
      if (y < -80) y += H + 160; else if (y > H + 80) y -= H + 160;
      px[i] = x; py[i] = y; pvx[i] = vx; pvy[i] = vy;
    }
  }

  function render() {
    /* Warm cream trail fade — matches Personal variation bg #F5F0E8 */
    var skyGrd = ctx.createLinearGradient(0, 0, 0, H);
    skyGrd.addColorStop(0, 'rgba(245, 240, 232, ' + TRAIL_ALPHA + ')');
    skyGrd.addColorStop(0.5, 'rgba(240, 234, 224, ' + TRAIL_ALPHA + ')');
    skyGrd.addColorStop(1, 'rgba(235, 228, 218, ' + TRAIL_ALPHA + ')');
    ctx.fillStyle = skyGrd;
    ctx.fillRect(-1, -1, W + 2, H + 2);

    ctx.lineCap = 'round';
    var invMax = 1.0 / MAX_SPEED;

    /* Dim particles — warm brown/terracotta */
    ctx.strokeStyle = 'rgba(170, 120, 85, 0.35)';
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    for (var i = 0; i < pcount; i++) {
      if (pbright[i] >= 0.72) continue;
      var vx = pvx[i], vy = pvy[i], spd2 = vx * vx + vy * vy;
      if (spd2 < 100) continue;
      var spd = Math.sqrt(spd2), tailLen = spd * invMax * 4.5, inv = 1 / spd;
      ctx.moveTo(px[i] - vx * inv * tailLen, py[i] - vy * inv * tailLen);
      ctx.lineTo(px[i] + vx * inv * tailLen * 0.3, py[i] + vy * inv * tailLen * 0.3);
    }
    ctx.stroke();

    /* Bright particles — deeper terracotta/sienna */
    ctx.strokeStyle = 'rgba(150, 82, 50, 0.5)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    for (var i = 0; i < pcount; i++) {
      if (pbright[i] < 0.72) continue;
      var vx = pvx[i], vy = pvy[i], spd2 = vx * vx + vy * vy;
      if (spd2 < 100) continue;
      var spd = Math.sqrt(spd2), tailLen = spd * invMax * 4.5, inv = 1 / spd;
      ctx.moveTo(px[i] - vx * inv * tailLen, py[i] - vy * inv * tailLen);
      ctx.lineTo(px[i] + vx * inv * tailLen * 0.3, py[i] + vy * inv * tailLen * 0.3);
    }
    ctx.stroke();
  }

  function fillBackground() {
    var grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#F5F0E8');
    grd.addColorStop(0.5, '#F0EAE0');
    grd.addColorStop(1, '#EBE4DA');
    ctx.fillStyle = grd;
    ctx.fillRect(-1, -1, W + 2, H + 2);
  }

  function loop(ts) {
    if (!running) { requestAnimationFrame(loop); return; }
    if (lastTime === 0) lastTime = ts;
    var rawDt = (ts - lastTime) * 0.001; lastTime = ts;
    var dt = rawDt < 0.05 ? rawDt : 0.05; if (dt <= 0) dt = 0.016;
    time += dt * 1000; frameCount++;
    if (prefersReduced) { if (Math.random() < 0.02) { updateParticles(dt * 0.1); render(); } requestAnimationFrame(loop); return; }
    if (time > nextImpulseTime) spawnImpulse();
    updateParticles(dt); render(); requestAnimationFrame(loop);
  }

  resize(); attractX = W * 0.5; attractY = H * 0.5;
  fillBackground(); initParticles(); scheduleImpulse();
  lastTime = 0; requestAnimationFrame(loop);

  canvas.addEventListener('mousemove', function(e) { mouseX = e.clientX; mouseY = e.clientY; mouseActive = true; });
  canvas.addEventListener('mouseleave', function() { mouseActive = false; });
  canvas.addEventListener('mousedown', function(e) { mouseDown = true; mouseX = e.clientX; mouseY = e.clientY; mouseActive = true; });
  canvas.addEventListener('mouseup', function() { mouseDown = false; });
  canvas.addEventListener('touchstart', function(e) { e.preventDefault(); mouseDown = true; mouseActive = true; mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }, { passive: false });
  canvas.addEventListener('touchmove', function(e) { e.preventDefault(); mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }, { passive: false });
  canvas.addEventListener('touchend', function() { mouseDown = false; mouseActive = false; });
  window.addEventListener('resize', function() { var oldW = W, oldH = H; resize(); fillBackground(); if (oldW > 0 && oldH > 0) { var sx = W / oldW, sy = H / oldH; for (var i = 0; i < pcount; i++) { px[i] *= sx; py[i] *= sy; } } });
  document.addEventListener('visibilitychange', function() { running = !document.hidden; if (running) lastTime = 0; });
})();
</script>
</body>
</html>
